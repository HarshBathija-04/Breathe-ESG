# Production-like local stack: Postgres + gunicorn API + nginx-served SPA.
#   docker compose up --build
#   Frontend: http://localhost:5205   API: http://localhost:5110/health
# Secrets below are local-only placeholders; override them via a .env file.
name: breathe-esg

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: esg_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port: only the backend talks to the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esg_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False" # plain HTTP on localhost
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret-change-me}
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-change-me}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/esg_platform
      DB_SCHEMA: breathe_esg
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      FRONTEND_URL: http://localhost:5205
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_db &&
             gunicorn esg_platform.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 120 --access-logfile -"
    ports:
      - "5110:8000"
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./app
      args:
        VITE_API_URL: http://localhost:5110/api
    restart: unless-stopped
    ports:
      - "5205:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  media_files:

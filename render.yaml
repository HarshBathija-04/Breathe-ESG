# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Declares the Django API only. The PostgreSQL database is shared by several
# portfolio apps and is created once by hand, so there is deliberately no
# `databases:` block: paste its connection string into DATABASE_URL. This app
# keeps its tables in its own schema (DB_SCHEMA), created by migrations.
services:
  - type: web
    name: breathe-esg-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: bash ./build.sh
    startCommand: gunicorn esg_platform.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --max-requests 500 --max-requests-jitter 50 --access-logfile -
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DEBUG
        value: "False"
      - key: DB_SCHEMA
        value: breathe_esg
      - key: DATABASE_URL
        sync: false # shared Render Postgres connection string (internal URL)
      - key: FRONTEND_URL
        sync: false # e.g. https://breathe-esg.vercel.app (comma-separate several)
      - key: GROQ_API_KEY
        sync: false # enables the AI emissions briefing
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
